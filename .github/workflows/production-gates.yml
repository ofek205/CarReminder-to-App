# Production gates — runs on every PR that targets `main`.
#
# Mechanical checks only (build + lint). Cognitive gates (code-review,
# QA mental walkthrough, gatekeeper) live in CLAUDE.md and run inside a
# Claude session, before the PR is opened.
#
# A failure here blocks the merge button in GitHub UI when branch
# protection is enabled (Settings → Branches → main → "Require status
# checks to pass before merging" → select "build" and "lint").

name: Production gates

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Build the SAME bundle the production CI builds — i.e. with the
      # supabase env vars injected. Without these, Vite happily produces
      # a "successful" bundle that bakes `undefined` into every
      # `import.meta.env.VITE_SUPABASE_URL` reference, the iOS TestFlight
      # build runs with a stub client, and the user is stuck on a green
      # splash forever (see ios-release.yml for the full failure mode).
      # The PR gate now catches a regression in env-injection too.
      - env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Lint must be clean for a production merge — see CLAUDE.md
      # ("חוב lint קיים — חוק --no-verify"). Bypass is permitted only on
      # pushes to the `staging` branch, never on PRs into `main`.
      - run: npm run lint

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Pins invariants that a build and a lint run cannot see:
      #   - which fields may reach the offline cache on disk (role, signed URLs,
      #     third-party PII) — a privacy rule that a new column silently breaks
      #   - the DAL's envelope-vs-throw contract, which is what let the offline
      #     write guard land without editing ~200 call sites
      #   - every dal.run('name') resolving to a registered command, since the
      #     name is a string and no type or lint check can catch a typo
      #   - no screen writing to supabase directly, the seam's one invariant
      # Needs no secrets: everything here is pure logic or a source scan.
      - run: npm test

  query-timeouts:
    name: Query timeout gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No npm install needed — the script is plain Node, no
      # dependencies. Failing here means new code introduced a
      # Supabase call inside a useQuery body without a timeout
      # wrapper. See scripts/check-query-timeouts.cjs and
      # CLAUDE.md gate "Query Timeout Gate".
      - run: node scripts/check-query-timeouts.cjs

  view-as-identity:
    name: View-as identity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Plain Node, no dependencies. Failing here means an admin RPC is
      # being called on the impersonation-proxied `supabase` client, where
      # it arrives as the viewed user and fails is_admin() — silently, in
      # most of the call sites. Use the `adminSupabase` export instead.
      # See scripts/check-view-as-identity.cjs.
      - run: node scripts/check-view-as-identity.cjs
